<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241827"/>
      <stop offset=".55" stop-color="#171019"/>
      <stop offset="1" stop-color="#0c080e"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="100"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <circle cx="300" cy="250" r="300" fill="#7c4a63" opacity=".46"/>
    <circle cx="1280" cy="240" r="330" fill="#5c4a7a" opacity=".4"/>
    <ellipse cx="900" cy="900" rx="520" ry="280" fill="#4c3048" opacity=".52"/>
    <circle cx="150" cy="860" r="240" fill="#b06a6a" opacity=".24"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="1080" cy="680" r="90" fill="#d0a0a0" opacity=".28"/>
    <circle cx="1180" cy="760" r="60" fill="#e0b7a8" opacity=".2"/>
    <circle cx="500" cy="380" r="56" fill="#c68f9e" opacity=".2"/>
    <circle cx="820" cy="220" r="42" fill="#d7b3c4" opacity=".18"/>
  </g>
</svg>
