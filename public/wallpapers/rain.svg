<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142027"/>
      <stop offset=".55" stop-color="#0d151a"/>
      <stop offset="1" stop-color="#080d10"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="100"/>
    </filter>
    <filter id="streak" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="light" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <ellipse cx="330" cy="180" rx="380" ry="260" fill="#5d8593" opacity=".4"/>
    <ellipse cx="1290" cy="300" rx="420" ry="280" fill="#3f6474" opacity=".42"/>
    <ellipse cx="900" cy="940" rx="520" ry="250" fill="#263d48" opacity=".6"/>
    <circle cx="180" cy="880" r="230" fill="#4a6a75" opacity=".28"/>
  </g>

  <g filter="url(#streak)" opacity=".26">
    <rect x="220" y="60" width="10" height="760" rx="5" fill="#a8c4cc"/>
    <rect x="340" y="140" width="6" height="620" rx="3" fill="#8fb0bb"/>
    <rect x="520" y="20" width="8" height="880" rx="4" fill="#b3ccd3"/>
    <rect x="760" y="180" width="5" height="560" rx="3" fill="#8aa7b1"/>
    <rect x="1010" y="80" width="9" height="720" rx="4" fill="#a5bfc7"/>
    <rect x="1220" y="210" width="6" height="520" rx="3" fill="#93b0ba"/>
    <rect x="1410" y="60" width="8" height="800" rx="4" fill="#b0c8cf"/>
  </g>

  <g filter="url(#light)">
    <circle cx="1150" cy="700" r="78" fill="#d8a862" opacity=".3"/>
    <circle cx="430" cy="340" r="54" fill="#9fc4d0" opacity=".24"/>
    <circle cx="980" cy="180" r="44" fill="#c6dbe0" opacity=".22"/>
  </g>
</svg>
