<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152018"/>
      <stop offset=".55" stop-color="#0d1510"/>
      <stop offset="1" stop-color="#070c09"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="105"/>
    </filter>
    <filter id="sun" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="leaf" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <ellipse cx="260" cy="250" rx="380" ry="300" fill="#3f6b4c" opacity=".5"/>
    <ellipse cx="1320" cy="220" rx="400" ry="300" fill="#2f5b42" opacity=".46"/>
    <ellipse cx="1050" cy="860" rx="460" ry="280" fill="#24412f" opacity=".6"/>
    <ellipse cx="380" cy="880" rx="320" ry="240" fill="#4a6a45" opacity=".34"/>
  </g>

  <g filter="url(#sun)">
    <circle cx="860" cy="180" r="150" fill="#d9b978" opacity=".3"/>
    <circle cx="1030" cy="300" r="80" fill="#e6cf9a" opacity=".22"/>
  </g>

  <g filter="url(#leaf)" opacity=".34">
    <ellipse cx="180" cy="520" rx="120" ry="42" fill="#7e9a5f" transform="rotate(-24 180 520)"/>
    <ellipse cx="1410" cy="600" rx="150" ry="48" fill="#6f8f5f" transform="rotate(18 1410 600)"/>
    <ellipse cx="720" cy="760" rx="130" ry="38" fill="#557850" transform="rotate(-12 720 760)"/>
    <ellipse cx="1180" cy="120" rx="100" ry="34" fill="#87a06a" transform="rotate(26 1180 120)"/>
  </g>
</svg>
