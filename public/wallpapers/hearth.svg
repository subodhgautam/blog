<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1d13"/>
      <stop offset=".55" stop-color="#1a120c"/>
      <stop offset="1" stop-color="#0f0a07"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="95"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="ember" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <circle cx="250" cy="240" r="270" fill="#e09a4f" opacity=".5"/>
    <circle cx="1330" cy="700" r="330" fill="#b45f3c" opacity=".42"/>
    <ellipse cx="900" cy="140" rx="470" ry="210" fill="#f2c078" opacity=".22"/>
    <circle cx="700" cy="880" r="300" fill="#7a3f2e" opacity=".5"/>
    <circle cx="120" cy="820" r="220" fill="#9c6a3f" opacity=".28"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="1080" cy="300" r="70" fill="#f5c57f" opacity=".45"/>
    <circle cx="1180" cy="430" r="42" fill="#ffd9a0" opacity=".35"/>
    <circle cx="430" cy="520" r="60" fill="#e7a45e" opacity=".3"/>
    <circle cx="820" cy="240" r="34" fill="#ffdba6" opacity=".32"/>
  </g>

  <g filter="url(#ember)" opacity=".55">
    <circle cx="1010" cy="640" r="6" fill="#ffd9a0"/>
    <circle cx="1060" cy="690" r="4" fill="#ffc987"/>
    <circle cx="1120" cy="600" r="5" fill="#ffe0b0"/>
    <circle cx="980" cy="720" r="3" fill="#ffcf95"/>
    <circle cx="1190" cy="660" r="4" fill="#ffd6a3"/>
  </g>
</svg>
